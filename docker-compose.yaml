services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Europe/Vienna}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-password}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KC_DB_SCHEMA: public
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realms:/opt/keycloak/data/import

  icewarp-mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    command: --lower-case-table-names=1
    environment:
      MARIADB_ROOT_PASSWORD: ${ICEWARP_DB_PASSWORD:-password}
    volumes:
      - icewarp_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Document-preview service. IceWarp's entrypoint waits for it on startup and
  # can't be disabled, so it runs even though the bridge doesn't use previews.
  laforge:
    image: ${LAFORGE_IMAGE:-icewarptechnology/laforge:2.2.3}
    restart: unless-stopped

  icewarp:
    image: ${ICEWARP_IMAGE:-icewarptechnology/icewarp-server:14}
    restart: unless-stopped
    depends_on:
      icewarp-mariadb:
        condition: service_healthy
      laforge:
        condition: service_started
    environment:
      MARIADB_HOST: icewarp-mariadb
      MARIADB_ROOT_PASSWORD: ${ICEWARP_DB_PASSWORD:-password}
      ICEWARP_DOMAIN: ${ICEWARP_DOMAIN:-icewarp.local}
      ICEWARP_ADMIN_USER: ${ICEWARP_ADMIN_USER:-admin}
      ICEWARP_ADMIN_PASS: ${ICEWARP_ADMIN_PASSWORD:-password}
      ICEWARP_PUBLIC_HOSTNAME: ${ICEWARP_PUBLIC_HOSTNAME:-localhost}
      # A 30-day trial license is requested automatically while ICEWARP_LICENSE
      # is unset. LAFORGE_URL defaults to http://laforge:25791 (service above).
    ports:
      - "8081:80"    # web admin / webmail / REST API
      - "8443:443"   # HTTPS
    volumes:
      - icewarp_data:/opt/icewarp-data

volumes:
  postgres_data:
  icewarp_data:
  icewarp_mariadb_data:
